term: 'Queue'
firstSprint: data-structures-and-algorithms-in-c
explanation: 'A queue is a collection where the first item added is the first one out, like a line at a shop. You add at the back (enqueue) and take from the front (dequeue).'
codeExample:
  language: c
  code: |
    #include <stdio.h>

    int queue[10];
    int front = 0, back = 0;

    void enqueue(int value) { queue[back++] = value; }
    int dequeue(void) { return queue[front++]; }

    int main(void) {
        enqueue(1);
        enqueue(2);
        enqueue(3);
        printf("%d\n", dequeue());   // 1
        printf("%d\n", dequeue());   // 2
        return 0;
    }
